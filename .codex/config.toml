model = "gpt-5.6-sol"
model_reasoning_effort = "high"

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

model_reasoning_summary = "none"
model_verbosity = "low"
plan_mode_reasoning_effort = "high"

allow_login_shell = false
default_permissions = "no-ssh"

[shell_environment_policy]
inherit = "all"
exclude = ["SSH_AUTH_SOCK", "SSH_AGENT_PID"]

[permissions.no-ssh]
extends = ":workspace"

[permissions.no-ssh.filesystem]
"~/.ssh" = "deny"

[sandbox_workspace_write]
network_access = true
writable_roots = [
  "/home/elmeri/Projects",
  "/home/elmeri/.local/share/Odoo",
  "/home/elmeri/Odoo/src",
]



