model = "gpt-5.6-sol"
model_reasoning_effort = "high"

approval_policy = "on-request"
approvals_reviewer = "auto_review"

model_reasoning_summary = "none"
model_verbosity = "low"
plan_mode_reasoning_effort = "high"

allow_login_shell = false
default_permissions = "no-ssh"

[features]
shell_snapshot = false

[shell_environment_policy]
inherit = "all"
exclude = ["SSH_AUTH_SOCK", "SSH_AGENT_PID"]

[permissions.no-ssh]
extends = ":workspace"

[permissions.no-ssh.filesystem]
"~/.ssh" = "deny"

[permissions.no-ssh.workspace_roots]
"/home/elmeri/Projects" = true
"/home/elmeri/.local/share/Odoo" = true
"/home/elmeri/Odoo/src" = true

[permissions.no-ssh.network]
enabled = true