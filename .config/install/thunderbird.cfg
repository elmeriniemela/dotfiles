// AutoConfig skips this first line.
lockPref("security.prompt_for_master_password_on_startup", true);

// Thunderbird's native startup prompt runs before profile-after-change.
// Cancel leaves the credential store locked; stop before opening mail windows.
Services.obs.addObserver(function checkPrimaryPassword(subject, topic) {
    Services.obs.removeObserver(checkPrimaryPassword, topic);
    try {
        const token = Components.classes["@mozilla.org/security/internalkeytoken;1"]
            .createInstance(Components.interfaces.nsIPKCS11Token);
        if (!token.hasPassword || token.isLoggedIn) {
            return;
        }
    } catch (error) {
        Components.utils.reportError(error);
    }
    Services.startup.quit(Components.interfaces.nsIAppStartup.eForceQuit);
}, "profile-after-change");
