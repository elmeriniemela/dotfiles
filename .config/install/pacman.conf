[options]
DisableDownloadTimeout
HoldPkg     = pacman glibc
# These packages are built from the PKGBUILDs in this repository.
IgnorePkg = python310-bin wkhtmltopdf-bin archlinux-logout
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
